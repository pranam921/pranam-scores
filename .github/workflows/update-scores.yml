name: Update fulfillment scores

on:
  schedule:
    # Three slots, not one. GitHub's scheduled runs are best-effort: the 11:00
    # slot fired at 16:52 on 2026-09-21 and had not fired by 11:52 the next
    # day, and runs can be dropped altogether under load. Each extra attempt is
    # free and silent — the script compares bytes and exits without committing
    # when the sheet has not moved — so a late or missed slot is picked up the
    # same day instead of leaving the site a day behind.
    - cron: "0 11 * * *" # ~6/7am ET
    - cron: "0 15 * * *" # ~10/11am ET
    - cron: "0 19 * * *" # ~2/3pm ET
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write # required for the job to push the refreshed JSON back

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild scores.json from the sheet
        env:
          # Set this repo secret to the "Publish to web" CSV URL of the
          # two-column feed tab. Without it the script falls back to the gviz
          # URL, which only works while the document is link-readable.
          SCORES_CSV_URL: ${{ secrets.SCORES_CSV_URL }}
        run: node scripts/build-scores.mjs

      - name: Commit if the scores changed
        run: |
          if git diff --quiet -- scores.json; then
            echo "No change today — nothing to commit."
            exit 0
          fi
          git config user.name  "scores-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json
          git commit -m "Update fulfillment scores through $(date -u +%Y-%m-%d)"
          git push
